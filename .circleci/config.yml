    docker:
      - image: mdernst/daikon-ubuntu-jdk11:latest
    resource_class: large
    environment:
      TERM: dumb
    steps:
      - restore_cache:
          keys:
            - &source-cache source-v1-{{ .Branch }}-{{ .Revision }}
            - source-v1-{{ .Branch }}-
            - source-v1-
      - checkout
      - save_cache:
          key: *source-cache
          paths:
            - ".git"
      - run:
          name: test-quick
          command: scripts/test-quick-txt-diff.sh

