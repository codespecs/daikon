name: Prek checks
"on": [push, pull_request]
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo snap install circleci
      - run: whoami
      - run: echo "HOME=$HOME"
      - run: ls -al "$HOME"
      - run: ls -al /home
      - run: ls -al /home/runner
      - run: ls -al /home/runner/.config
      - run: ls -al /home/runner/.config/circleci || true
      - run: sudo mkdir /home/runner/.config/circleci
      - run: sudo chown "$USER" /home/runner/
      - run: sudo chown "$USER" /home/runner/.config
      - run: sudo chown "$USER" /home/runner/.config/circleci
      - uses: j178/prek-action@v2
