# DO NOT EDIT azure-pipelines.yml.  Edit azure-pipelines.yml.m4 and defs.m4 instead.

trigger:
  batch: true
  branches:
    include:
      - '*'
pr:
  branches:
    include:
      - '*'

jobs:

  # The dependsOn clauses are:
  #  * Everything depends on the canary jobs (the main jdk25 jobs), except those jobs themselves.
  #  * Any *_jdkNN job (NN != 25) depends on the corresponding *_jdk25 job.
  #  * Anything *_rockylinux_* depends on *_ubuntu_*.
  - job: canary_jobs
    dependsOn:
      - quick_ubuntu_jdk25
      - nonquick_ubuntu_jdk25
      - nontxt_ubuntu_jdk25
      - misc_ubuntu_jdk25
      - kvasir_ubuntu_jdk25
      - typecheck_latest_part1_ubuntu_jdk25
      - typecheck_latest_part2_ubuntu_jdk25
      - typecheck_latest_part3_ubuntu_jdk25
      - typecheck_bundled_part1_ubuntu_jdk25
      - typecheck_bundled_part2_ubuntu_jdk25
      - typecheck_bundled_part3_ubuntu_jdk25
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: none
      - bash: true
        displayName: canary_jobs

  - job: quick_ubuntu_jdk11
    dependsOn:
      - canary_jobs
      - quick_ubuntu_jdk25
    pool:
      vmImage: 'ubuntu-latest'
    container: mdernst/daikon-ubuntu-jdk11:latest
    steps:
      - checkout: self
        fetchDepth: 25
      - bash: scripts/test-quick-txt-diff.sh
        displayName: test-quick
  - job: quick_ubuntu_jdk17
